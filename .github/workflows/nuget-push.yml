name: NuGet Publish

on:
  workflow_dispatch:
    inputs:
      pack_run_id:
        description: Optional successful NuGet Pack run ID; otherwise latest for this commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  nuget-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write # Required for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          

      - name: Set up Python for security verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve matching successful package and security runs
        timeout-minutes: 25
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RUN_ID: ${{ inputs.pack_run_id }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          args=()
          if [[ -n "$PACK_RUN_ID" ]]; then args+=(--run-id "$PACK_RUN_ID"); fi
          python3 build/security/ci_workflows.py publish --wait-seconds 1200 "${args[@]}"

      - name: Download the exact verified package build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: ServiceStack Packages
          path: build/staging
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.pack_run_id }}

      - name: Verify matching package evidence and report advisory warnings
        run: python3 build/security/security_artifacts.py verify --repo build/security-output --package-config build/security-output/packages.json --package-directory build/staging --report-advisories

      - name: Check output
        working-directory: ./build
        run: |
          cd staging
          export number_of_packages=$(ls -1 | wc -l)
          echo "number_of_packages=${number_of_packages}" >> $GITHUB_ENV

      # Configure the matching NuGet.org policy using .github/NUGET_PUBLISHING.md.
      - name: NuGet login with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 #v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        working-directory: ./build/staging
        run: |
          # Check if more than 48 packages 
          if [[ ${number_of_packages} -gt 48 ]]; then
            echo "Pushing to NuGet"
            dotnet nuget push '*.nupkg' -s 'https://api.nuget.org/v3/index.json' -k "$NUGET_API_KEY" --skip-duplicate
          else
            echo 'Less files than expected, skipping push'
            exit 1
          fi

      - name: Record evidence for the successfully published packages
        env:
          PACK_RUN_ID: ${{ steps.evidence.outputs.pack_run_id }}
        run: python3 build/security/release_assets.py record --pack-run-id "$PACK_RUN_ID"

      - name: Retain the exact published security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: ServiceStack Published Security
          retention-days: 90
          path: build/security-output/
          if-no-files-found: error

  release-assets:
    needs: nuget-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download evidence verified by this publish run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: ServiceStack Published Security
          path: build/security-output
      - name: Attach security ZIP to the release or prepare its draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          python3 build/security/release_assets.py attach
