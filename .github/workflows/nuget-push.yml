name: NuGet Publish

on:
  workflow_dispatch:
    inputs:
      pack_run_id:
        description: Optional successful NuGet Pack run ID; otherwise latest for this commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  nuget-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          

      - name: Set up Python for security verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve matching successful package and security runs
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RUN_ID: ${{ inputs.pack_run_id }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          args=()
          if [[ -n "$PACK_RUN_ID" ]]; then args+=(--run-id "$PACK_RUN_ID"); fi
          python3 build/security/ci_workflows.py publish "${args[@]}"

      - name: Download the exact verified package build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: ServiceStack Packages
          path: build/staging
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.pack_run_id }}

      - name: Verify matching package evidence before publishing
        run: python3 build/security/security_artifacts.py verify --repo build/security-output --package-config build/security-output/packages.json --package-directory build/staging --require-clean

      - name: Check output
        working-directory: ./build
        run: |
          cd staging
          export number_of_packages=$(ls -1 | wc -l)
          echo "number_of_packages=${number_of_packages}" >> $GITHUB_ENV

      - name: Push to NuGet
        working-directory: ./build/staging
        run: |
          # Check if more than 48 packages 
          if [[ ${number_of_packages} -gt 48 ]]; then
            echo "Pushing to NuGet"
            dotnet nuget push '*.nupkg' -s 'https://api.nuget.org/v3/index.json' -k '${{ secrets.NUGET_APIKEY }}' --skip-duplicate
          else
            echo 'Less files than expected, skipping push'
            exit 1
          fi
