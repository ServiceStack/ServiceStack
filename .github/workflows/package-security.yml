name: Package Security Evidence

on:
  workflow_run:
    workflows: ["NuGet Pack", "A Pre Release Pack"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pack_run_id:
        description: Successful NuGet Pack or A Pre Release Pack run ID to regenerate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  security-evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out current security tooling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and validate the source pack run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RUN_ID: ${{ inputs.pack_run_id || github.event.workflow_run.id }}
        run: python3 build/security/ci_workflows.py source --run-id "$PACK_RUN_ID"

      - name: Check out the exact package build source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
        with:
          ref: ${{ steps.source.outputs.pack_commit }}
          path: package-source
          persist-credentials: false

      - name: Download packages from the selected pack run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: ServiceStack Packages
          path: build/staging
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.pack_run_id }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Generate SBOM and reviewed VEX evidence
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.pack_run_id }}
          SOURCE_COMMIT: ${{ steps.source.outputs.pack_commit }}
          SOURCE_RUN_URL: ${{ steps.source.outputs.pack_url }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          python3 build/security/security_artifacts.py generate --repo package-source --package-config package-source/build/security/packages.json --package-directory build/staging --output-root build/security-output
          cp package-source/build/security/packages.json build/security-output/packages.json
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          provenance = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "packRunId": os.environ["SOURCE_RUN_ID"],
              "packCommit": os.environ["SOURCE_COMMIT"],
              "packRunUrl": os.environ["SOURCE_RUN_URL"],
              "securityRunId": os.environ["GITHUB_RUN_ID"],
              "securityToolCommit": os.environ["GITHUB_SHA"],
          }
          Path("build/security-output/source-run.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PYTHON

      - name: Build downloadable evidence ZIP
        env:
          PACK_RUN_ID: ${{ steps.source.outputs.pack_run_id }}
        run: python3 build/security/bundle_security.py --root build/security-output --output "build/security-archives/servicestack-security-pack-$PACK_RUN_ID.zip"

      - name: Verify evidence and check dependency advisories
        run: python3 build/security/security_artifacts.py verify --repo build/security-output --package-config build/security-output/packages.json --package-directory build/staging --require-clean

      - name: Preserve generated security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: ServiceStack Security
          retention-days: 90
          path: build/security-output/
          if-no-files-found: warn

      - name: Preserve downloadable ZIP and checksum
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: ServiceStack Security ZIP
          retention-days: 90
          path: build/security-archives/
          if-no-files-found: warn
