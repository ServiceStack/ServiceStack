name: Pre Release Security Evidence

on:
  workflow_run:
    workflows: ["A Pre Release Pack"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  security-evidence:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the package build commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download packages from the completed pack run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: ServiceStack Packages
          path: build/staging
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate package SBOM and reviewed VEX evidence
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          python3 build/security/security_artifacts.py generate --package-directory build/staging --output-root build/security-output
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          provenance = {
              "packRunId": os.environ["SOURCE_RUN_ID"],
              "packCommit": os.environ["SOURCE_COMMIT"],
              "packRunUrl": os.environ["SOURCE_RUN_URL"],
          }
          Path("build/security-output/source-run.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PYTHON

      - name: Verify package evidence and check dependency advisories
        run: |
          python3 build/security/security_artifacts.py verify --repo build/security-output --package-directory build/staging --require-clean

      - name: Preserve generated security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: ServiceStack Security
          retention-days: 90
          path: build/security-output/
          if-no-files-found: warn
