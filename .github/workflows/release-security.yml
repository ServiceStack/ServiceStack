name: Release Security Download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag; reuse verified NuGet Publish evidence
        required: true
        type: string
      publish_run_id:
        description: Optional NuGet Publish run ID; otherwise find matching version
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-security:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Check out current security tooling and reviewed decisions
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd #v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch security evidence from the successful NuGet publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          python3 -m pip install -r build/security/requirements.txt
          args=()
          if [[ -n "$PUBLISH_RUN_ID" ]]; then args+=(--publish-run-id "$PUBLISH_RUN_ID"); fi
          python3 build/security/release_assets.py fetch --tag "$RELEASE_TAG" "${args[@]}"

      - name: Attach the verified security ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/security/release_assets.py attach --tag "$RELEASE_TAG"

      - name: Preserve generated evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: ServiceStack Release Security
          retention-days: 90
          path: build/security-output/
          if-no-files-found: warn
