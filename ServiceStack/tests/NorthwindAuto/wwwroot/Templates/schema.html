<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${Title}</title>
    <link rel="stylesheet" href="/css/ui.css">
    <base href="">
    <script type="importmap">
        {
            "imports": {
                "vue": "../js/vue.mjs",
                "vue-router": "../js/vue-router.mjs",
                "@servicestack/vue": "../js/servicestack-vue.mjs",
                "@servicestack/client": "../js/servicestack-client.mjs"
            }
        }
    </script>
    <script>
        // Apply the theme before first paint to avoid a flash of the wrong one.
        // Uses the same localStorage key as <DarkModeToggle>
        (function () {
            const saved = localStorage.getItem('color-scheme')
            const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
            document.documentElement.classList.toggle('dark', dark)
            document.documentElement.style.setProperty('color-scheme', dark ? 'dark' : null)
        })()
    </script>
    <style>
        /* Inputs carry `bg-white dark:bg-black`, and @layer utilities outranks @layer base, so
           those override @tailwindcss/forms' checked background — leaving the white tick
           invisible on white. Unlayered rules beat every layer, so this restores it. */
        [type='checkbox']:checked, [type='radio']:checked { background-color: currentColor; }
    </style>
    <script>window.Schema=${Schema}</script>
    <script>window.Auth=${Auth}</script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 text-sm">

<div id="app"></div>

<script type="module">
import { createApp, computed, ref, inject, provide } from "vue"
import { JsonServiceClient } from "@servicestack/client"
import ServiceStackVue, {
    useAuth, requirementText, subtitle, toOp, useApiKey
} from "@servicestack/vue"
import ApiExplorerSchema from "../js/components/ApiExplorerSchema.mjs"
import AvatarButton from "../js/components/AvatarButton.mjs"

const Schema = window.Schema
if (window.Auth) useAuth().signIn(window.Auth)

const METHOD_CLASS = {
    GET: 'bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300',
    POST: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300',
    PUT: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    PATCH: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    DELETE: 'bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300',
}

/** A padlock that says what the API needs, kept out of the way until asked for */
const AuthLock = {
    props: { text: String },
    template: `
    <div class="relative">
        <button type="button" @click="open = !open" title="Access required"
                class="rounded-md p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200
                       hover:bg-gray-100 dark:hover:bg-gray-800">
            <span class="sr-only">Access required</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75
                    11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25
                    2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
            </svg>
        </button>
        <div v-if="open" class="fixed inset-0 z-10" @click="open = false"></div>
        <div v-if="open" class="absolute left-0 mt-1 w-72 z-20 rounded-lg shadow-lg p-3 text-xs
                                border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
            <p class="font-semibold mb-1">Access required</p>
            <p class="text-gray-500 dark:text-gray-400">requires {{ text }}</p>
        </div>
    </div>`,
    setup: () => ({ open: ref(false) }),
}

const template = `
<div class="min-h-screen">

    <header class="sticky top-0 z-20 border-b border-gray-200 dark:border-gray-800
                   bg-white/90 dark:bg-gray-900/90 backdrop-blur">
        <div class="mx-auto max-w-[110rem] px-4 py-3 flex items-start gap-3">
            <a href="/schema" title="All APIs"
               class="mt-0.5 shrink-0 rounded-md p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200
                      hover:bg-gray-100 dark:hover:bg-gray-800">
                <span class="sr-only">All APIs</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                </svg>
            </a>

            <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-xl font-semibold">{{ Schema.title || Schema.request }}</h1>
                    <span :class="['font-mono text-[11px] font-semibold rounded ml-4 mt-1 px-1.5 py-0.5', methodClass]">
                        {{ method }}
                    </span>
                    <code class="mt-1 font-mono text-xs text-gray-500 dark:text-gray-400">{{ Schema.$id }}</code>
                    <AuthLock v-if="authText" :text="authText" />
                    <button v-if="requiresApiKey" type="button" @click="showApiKeyDialog = true"
                            :title="apiKey ? 'API Key configured' : 'API Key required'"
                            class="rounded-md p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
                        <span class="sr-only">API Key</span>
                        <svg class="w-5 h-5" :class="apiKey ? 'text-emerald-500' : 'text-amber-500'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
                        </svg>
                    </button>
                </div>
                <p v-if="pageSubtitle" class="text-gray-500 dark:text-gray-400" v-html="pageSubtitle"></p>
            </div>

            <span class="flex-1"></span>
            <AvatarButton />
            <DarkModeToggle class="mt-1" />
        </div>
    </header>

    <main class="mx-auto max-w-[110rem] px-4 py-5">
        <ApiExplorerSchema :schema="Schema" />
    </main>

    <api-key-dialog v-if="showApiKeyDialog" @done="showApiKeyDialog = false" @save="onApiKeySaved"></api-key-dialog>
</div>`

const App = {
    components: { AuthLock, ApiExplorerSchema, AvatarButton },
    template,
    setup() {
        const method = Schema.method || 'POST'
        const client = inject('client', null) ?? new JsonServiceClient()
        provide('client', client)
        const globalApiKey = useApiKey()
        const apiKey = computed(() => globalApiKey.value || client.bearerToken || '')
        const requiresApiKey = computed(() => !!Schema.auth?.requiresApiKey)
        const showApiKeyDialog = ref(false)
        function onApiKeySaved(key) {
            if (client) client.bearerToken = key
            globalApiKey.value = key
        }
        return {
            Schema,
            method,
            methodClass: METHOD_CLASS[method] ?? METHOD_CLASS.POST,
            pageSubtitle: subtitle(Schema),
            authText: Schema.auth ? requirementText(Schema.auth) : null,
            requiresApiKey,
            apiKey,
            showApiKeyDialog,
            onApiKeySaved,
        }
    },
}

const app = createApp(App)
app.use(ServiceStackVue)
app.mount('#app')
</script>

</body>
</html>
