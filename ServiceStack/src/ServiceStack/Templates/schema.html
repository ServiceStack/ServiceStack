/**
 * The HTML view of /schema/{RequestDto}: renders one API's schema as a form you can fill in
 * and execute, alongside exactly what gets sent and exactly what comes back.
 *
 * The form, the request building and the error binding are all AutoQuerySchema's — imported
 * rather than reimplemented, so an API behaves here the way it does in the CRUD UI:
 *
 *   SchemaInput    one input per property, picking the widget from the schema and binding its
 *                  own ResponseStatus.Errors[].FieldName message
 *   buildRequest   the method, URL, querystring/JSON/multipart body, and AutoQuery's Patch
 *                  `reset` rules - the preview and the actual call read the same function, so
 *                  what's shown is what's sent
 *   propsOf/toOp/requirementText/subtitle
 */
import { createApp, computed, ref, shallowRef, onMounted, onUnmounted, Teleport } from "vue"
import ServiceStackVue, { useAuth } from "@servicestack/vue"
import { SchemaInput, buildRequest, propsOf, toOp, requirementText, subtitle }
    from "../js/components/AutoQuerySchema.mjs"
import JsonView, { unwrapResponse } from "../js/components/JsonView.mjs"

// --- helpers ---------------------------------------------------------------

const bytes = n => n < 1024 ? `${n} B`
    : n < 1024 * 1024 ? `${(n / 1024).toFixed(1)} KB`
    : `${(n / 1024 / 1024).toFixed(1)} MB`

const escapeHtml = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

/**
 * Minimal JSON highlighter. A response is the whole point of this page, so it earns colour;
 * pulling in a syntax highlighter for one language does not.
 */
function highlight(json) {
    return escapeHtml(json).replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
        match => {
            const cls = /^"/.test(match)
                ? (/:$/.test(match) ? 'text-sky-700 dark:text-sky-300' : 'text-emerald-700 dark:text-emerald-300')
                : /true|false/.test(match) ? 'text-purple-700 dark:text-purple-300'
                : /null/.test(match) ? 'text-gray-400 dark:text-gray-500'
                : 'text-amber-700 dark:text-amber-300'
            return `<span class="${cls}">${match}</span>`
        })
}

/** The same request as a curl one-liner, so it can be run outside the browser as-is */
function toCurl({ method, url, headers, body, uploads }) {
    const origin = location.origin
    const parts = [`curl -X ${method} '${origin}${url}'`]
    for (const [k, v] of Object.entries(headers)) parts.push(`-H '${k}: ${v}'`)
    if (uploads.length) {
        for (const [k, v] of Object.entries(body)) {
            if (!uploads.includes(k)) parts.push(`-F '${k}=${v}'`)
        }
        for (const name of uploads) parts.push(`-F '${name}=@/path/to/file'`)
    } else if (method !== 'GET' && method !== 'DELETE') {
        parts.push(`-d '${JSON.stringify(body)}'`)
    }
    return parts.join(' \\\n  ')
}

/** A query string value arrives as text; the inputs and the API both want it typed */
function coerce(value, prop) {
    const type = prop?.type
    if (type === 'boolean') {
        // a bare `?Cancelled` reads as the flag being set, which is how links are written
        return value === '' || /^(true|1|on|yes)$/i.test(value)
    }
    if (type === 'integer' || type === 'number') {
        const n = Number(value)
        return Number.isFinite(n) && value !== '' ? n : undefined
    }
    if (type === 'array') {
        const values = Array.isArray(value) ? value : [value]
        if (prop.items?.type === 'object') return parseJson(values[0])
        // both `?Ids=1&Ids=2` and `?Ids=1,2` are common, so accept either
        return values.flatMap(v => String(v).split(',')).map(x => x.trim()).filter(Boolean)
    }
    if (type === 'object') return parseJson(value)
    return value
}

const parseJson = text => { try { return JSON.parse(text) } catch { return undefined } }

/**
 * Values for this API found in the page's own query string, so a link like
 *   /schema/QueryBookings?RoomType=Queen&Take=5
 * lands on the answer instead of a form to fill in again. Names are matched
 * case-insensitively, since the API itself accepts either casing.
 */
function fromQueryString(schema) {
    const params = new URLSearchParams(location.search)
    const byLower = new Map(Object.keys(schema.properties ?? {}).map(n => [n.toLowerCase(), n]))
    const to = {}
    for (const [key, value] of params) {
        const name = byLower.get(key.toLowerCase())
        if (!name || name in to) continue
        const prop = schema.properties[name]
        const parsed = coerce(prop?.type === 'array' ? params.getAll(key) : value, prop)
        if (parsed !== undefined) to[name] = parsed
    }
    return to
}

/** Updates the browser URL query string after form submission to include all non-empty values */
function updateUrlQueryString(schema, data) {
    const params = new URLSearchParams()
    const properties = schema?.properties ?? {}
    const byLowerProp = new Map(Object.entries(properties).map(([k, v]) => [k.toLowerCase(), v]))

    for (const [name, val] of Object.entries(data ?? {})) {
        if (val === undefined || val === null) continue
        const prop = properties[name] ?? byLowerProp.get(String(name).toLowerCase())
        const isNumberProp = prop?.type === 'integer' || prop?.type === 'number'

        if (isNumberProp || typeof val === 'number') {
            const num = Number(val)
            if (!Number.isFinite(num) || num === 0) continue
            params.set(name, String(num))
        } else if (prop?.type === 'boolean' || typeof val === 'boolean') {
            if (val === true || val === 'true') {
                params.set(name, 'true')
            }
        } else if (Array.isArray(val)) {
            if (val.length > 0) {
                params.set(name, val.join(','))
            }
        } else if (typeof val === 'object') {
            if (Object.keys(val).length > 0) {
                params.set(name, JSON.stringify(val))
            }
        } else if (typeof val === 'string') {
            const trimmed = val.trim()
            if (trimmed === '' || trimmed === '0') continue
            params.set(name, trimmed)
        }
    }

    const qs = params.toString()
    const newUrl = location.pathname + (qs ? '?' + qs : '')
    history.replaceState(null, '', newUrl)
}

}

                    2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>

/** A code block with a copy button - used for the request, the curl line and the response */
const CodeBlock = {
    props: { code: String, html: String, sizeClass: { type: String, default: 'max-h-[60vh]' } },
    template: `
    <div class="relative group flex flex-col h-full">
        <button type="button" @click="copy" :title="copied ? 'Copied' : 'Copy'"
                class="absolute right-2 top-2 z-10 rounded-md p-1.5 opacity-0 group-hover:opacity-100
                       focus:opacity-100 transition-opacity bg-white/80 dark:bg-gray-900/80
                       text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
            <span class="sr-only">Copy</span>
            <svg v-if="!copied" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504
                    1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125
                    1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504
                    1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621
                    0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12
                    6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375
                    3.375 0 0 0-3.375-3.375H9.75"/>
            </svg>
            <svg v-else class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
        </button>
        <pre :class="['overflow-auto rounded-lg bg-gray-50 dark:bg-black border border-gray-200',
                      'dark:border-gray-800 p-3 font-mono text-xs leading-relaxed flex-1 min-h-0', sizeClass]"
        ><code v-if="html" v-html="html"></code><code v-else>{{ code }}</code></pre>
    </div>`,
    setup(props) {
        const copied = ref(false)
        return {
            copied,
            copy() {
                navigator.clipboard?.writeText(props.code)
                copied.value = true
                setTimeout(() => copied.value = false, 1200)
            },
        }
    },
}

const App = {
    components: { SchemaInput, AuthLock, CodeBlock, JsonView, Teleport },
    template,
    setup() {
        const fields = propsOf(Schema)
        const blank = () => Object.fromEntries(fields.map(f => [f.name, undefined]))

        // anything the URL already answers for
        const prefilled = fromQueryString(Schema)
        const data = ref({ ...blank(), ...prefilled })
        const error = ref(null)
        const loading = ref(false)
        const result = ref(null)
        const tab = ref('Data')
        const showCurl = ref(false)
        const maximized = ref(false)
        const formHeight = ref(null)
        let resizeObserver = null
        const form = shallowRef(null)

        const { canAccess } = useAuth()
        const method = Schema.method || 'POST'

        const request = computed(() => buildRequest(Schema, data.value, form.value))

        const requestText = computed(() => {
            const r = request.value
            const lines = [`${r.method} ${r.url}`]
            for (const [k, v] of Object.entries(r.headers)) lines.push(`${k}: ${v}`)
            if (r.uploads.length) {
                lines.push('', `(multipart — uploading ${r.uploads.join(', ')})`)
            } else if (typeof r.payload === 'string' && r.payload !== '{}') {
                lines.push('', JSON.stringify(r.body, null, 2))
            }
            return lines.join('\n')
        })

        const boundFields = computed(() => {
            const names = Object.keys(Schema.properties ?? {})
            return (error.value?.errors ?? [])
                .map(e => e.fieldName)
                .filter(f => names.some(n => String(f ?? '').toLowerCase().startsWith(n.toLowerCase())))
        })

        async function execute() {
            updateUrlQueryString(Schema, data.value)
            loading.value = true
            error.value = null
            const started = performance.now()
            try {
                const r = buildRequest(Schema, data.value, form.value)
                const res = await fetch(r.url, { method: r.method, headers: r.headers, body: r.payload ?? undefined })
                const text = await res.text()
                const ms = Math.round(performance.now() - started)

                let pretty = text
                let json = null
                try {
                    json = text ? JSON.parse(text) : null
                    pretty = json != null ? JSON.stringify(json, null, 2) : text
                } catch { /* not JSON - show it raw */ }
                if (!pretty) pretty = '(no content)'

                result.value = {
                    json,
                    ok: res.ok,
                    status: res.status,
                    statusText: res.statusText,
                    ms,
                    size: bytes(new Blob([text]).size),
                    text: pretty,
                    headers: [...res.headers.entries()].map(([k, v]) => `${k}: ${v}`).join('\n'),
                }
                tab.value = json == null ? 'JSON' : 'Data'

                error.value = res.ok ? null : (json?.responseStatus ?? json?.ResponseStatus
                    ?? { message: `${res.status} ${res.statusText}`, errors: [] })
            } catch (e) {
                error.value = { message: e.message ?? String(e), errors: [] }
                result.value = null
            } finally {
                loading.value = false
            }
        }

        function onKeydown(e) {
            if (e.key === 'Escape' && maximized.value) {
                maximized.value = false
            }
        }

        function onFormEnter(e) {
            if (e.target?.tagName === 'TEXTAREA') return
            e.preventDefault()
            execute()
        }

        onMounted(() => {
            if (method === 'GET' && Object.keys(prefilled).length) execute()
            window.addEventListener('keydown', onKeydown)

            if (form.value && typeof ResizeObserver !== 'undefined') {
                resizeObserver = new ResizeObserver(entries => {
                    for (const entry of entries) {
                        formHeight.value = entry.target.offsetHeight
                    }
                })
                resizeObserver.observe(form.value)
            }
        })

        onUnmounted(() => {
            window.removeEventListener('keydown', onKeydown)
            if (resizeObserver) resizeObserver.disconnect()
        })

        const schemaJson = JSON.stringify(Schema, null, 2)

        return {
            Schema, form, fields, data, error, loading, result, tab, showCurl, method, maximized, formHeight,
            boundFields, requestText, execute, onFormEnter,
            schemaJson,
            schemaHtml: highlight(schemaJson),
            bodyHtml: computed(() => result.value ? highlight(result.value.text) : ''),

            payload: computed(() => {
                const { data, key, envelope } = unwrapResponse(result.value?.json)
                const total = envelope?.total ?? envelope?.Total
                const offset = envelope?.offset ?? envelope?.Offset ?? 0
                const range = Array.isArray(data) && data.length > 0
                    ? (total ? `${offset + 1}-${offset + data.length} of ${total}`
                             : `${offset + 1}-${offset + data.length}`)
                    : null
                return { data, key, range }
            }),
            curl: computed(() => toCurl(request.value)),
            tabs: ['Data', 'JSON', 'Headers', 'Schema'],
            paneHeight: 'max-h-[70vh] min-h-48',
            methodClass: METHOD_CLASS[method] ?? METHOD_CLASS.POST,
            pageSubtitle: subtitle(Schema),
            authText: Schema.auth ? requirementText(Schema.auth) : null,
            canCall: computed(() => canAccess(toOp(Schema))),
            reset: () => {
                data.value = blank()
                error.value = null
                result.value = null
                updateUrlQueryString(Schema, data.value)
            },
        }
    },
}

createApp(App).use(ServiceStackVue).mount('#app')
</script>

</body>
</html>
